<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHN Direct Mobile Preview</title>
</head>
<body>
<p style="padding:16px;font-family:Arial,sans-serif">Loading the direct NHN mobile test…</p>
<script>
fetch('index.html?direct-mobile-preview=5', {cache:'no-store'})
  .then(response => {
    if (!response.ok) throw new Error('Could not load test homepage');
    return response.text();
  })
  .then(html => {
    const exactFirstTestHero = `
      <style>
        .hero{position:relative!important;aspect-ratio:1728/864!important;background:#f5ead6 url('assets/heritage-landscape.png') center/100% 100% no-repeat!important;overflow:hidden!important;height:auto!important;min-height:0!important}
      </style>`;
    const mobileCss = '<link rel="stylesheet" href="mobile-icons-sep2026.css">';
    const previewMarker = '<meta name="robots" content="noindex,nofollow">';
    const facebookOnlyScript = '<script src="mobile-facebook-preview.js?v=20260906"><\/script>';

    // Replace the homepage hero with the exact simple hero used in the first successful mobile test.
    html = html.replace(/<header class="hero" id="home">[\s\S]*?<\/header>/i, '<header class="hero" id="home" aria-label="NHN hero preview"></header>');

    // Remove the normal homepage script because its hero code distorts the mobile artwork.
    html = html.replace(/<script\s+src="script\.js[^"]*"><\/script>/i, '');

    html = html.replace('</head>', mobileCss + exactFirstTestHero + previewMarker + '</head>');
    html = html.replace('</body>', facebookOnlyScript + '</body>');

    document.open();
    document.write(html);
    document.close();
  })
  .catch(error => {
    document.body.innerHTML = '<p style="padding:16px;font-family:Arial,sans-serif">The preview could not be loaded. Please refresh the page.</p>';
  });
</script>
</body>
</html>
