<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHN Direct Mobile Preview</title>
</head>
<body>
<p style="padding:16px;font-family:Arial,sans-serif">Loading the direct NHN mobile test…</p>
<script>
fetch('index.html?direct-mobile-preview=2', {cache:'no-store'})
  .then(response => {
    if (!response.ok) throw new Error('Could not load test homepage');
    return response.text();
  })
  .then(html => {
    const mobileCss = '<link rel="stylesheet" href="mobile-icons-sep2026.css">';
    const previewMarker = '<meta name="robots" content="noindex,nofollow">';
    const heroFix = `<script>
      window.addEventListener('load', function () {
        const hero = document.querySelector('.hero');
        const landscape = document.querySelector('.hero .landscape');
        if (hero && landscape && window.innerWidth <= 600) {
          hero.style.setProperty('background-image', 'none', 'important');
          landscape.style.setProperty('display', 'block', 'important');
          landscape.style.setProperty('inset', '0', 'important');
          landscape.style.setProperty('width', '100%', 'important');
          landscape.style.setProperty('height', '100%', 'important');
          landscape.style.setProperty('background-image', "url('assets/heritage-landscape.png')", 'important');
          landscape.style.setProperty('background-size', '100% 100%', 'important');
          landscape.style.setProperty('background-position', 'center center', 'important');
          landscape.style.setProperty('background-repeat', 'no-repeat', 'important');
        }
      });
    <\/script>`;
    html = html.replace('</head>', mobileCss + previewMarker + '</head>');
    html = html.replace('</body>', heroFix + '</body>');
    document.open();
    document.write(html);
    document.close();
  })
  .catch(error => {
    document.body.innerHTML = '<p style="padding:16px;font-family:Arial,sans-serif">The preview could not be loaded. Please refresh the page.</p>';
  });
</script>
</body>
</html>
