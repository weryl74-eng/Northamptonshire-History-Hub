<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get Involved in Northamptonshire History | Northants History Network</title>
<meta name="description" content="Join Northants History Network as a local history group, author, researcher, heritage organisation or individual interested in Northamptonshire’s past." />
<style>
:root{--green:#214d3a;--cream:#f6f0e3;--paper:#fffaf0;--ink:#2f2c28;--muted:#6f675f;--line:#d8cdb8;--gold:#b69555}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:1000px;margin:0 auto;padding:28px 18px 56px}
.back{display:inline-block;margin-bottom:18px;color:var(--green);font-weight:bold;text-decoration:none}
.back:hover,.back:focus-visible{text-decoration:underline;text-underline-offset:3px}
.tally-frame,.link-section{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.06);overflow:hidden}
.tally-frame{padding:10px}
.tally-frame iframe{display:block;width:100%;min-height:1800px;border:0}
.form-fallback{text-align:center;margin:12px 10px 10px;color:var(--muted);font-size:.92rem}
.form-fallback a,.link-section a{color:var(--green);font-weight:bold}
.link-section{margin-top:28px;padding:30px;text-align:center}
.link-section h2{margin:0 0 10px;color:var(--green);font-size:1.7rem}
.link-section p{max-width:720px;margin:0 auto 18px;line-height:1.6}
.link-card{display:inline-block;max-width:520px;width:100%;margin:8px auto 20px;padding:24px 26px;border:1px solid var(--gold);border-radius:18px;background:#fbf4e6;text-decoration:none;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.05)}
.link-card:hover,.link-card:focus-visible{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-1px)}
.link-card .name{display:block;color:var(--green);font-size:1.35rem;font-weight:bold;letter-spacing:.02em}
.link-card .flourish{display:block;color:var(--gold);font-size:1.3rem;margin:7px 0 5px;letter-spacing:.2em}
.link-card .strap{display:block;font-size:.98rem;line-height:1.45}
.link-card .url{display:block;margin-top:10px;color:var(--green);font-size:.9rem;font-weight:bold}
.instructions{text-align:left;max-width:760px;margin:0 auto}
.instructions h3{color:var(--green);margin:20px 0 8px}
.instructions ol{margin:8px 0 18px;padding-left:22px;line-height:1.6}
.code-wrap{position:relative}
textarea{width:100%;min-height:116px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;color:var(--ink);font:14px/1.5 Consolas,Monaco,monospace;resize:vertical}
.copy-btn{margin-top:10px;padding:10px 16px;border:0;border-radius:999px;background:var(--green);color:white;font-weight:bold;cursor:pointer}
.copy-btn:hover,.copy-btn:focus-visible{filter:brightness(.95)}
.copy-note{display:inline-block;margin-left:10px;color:var(--muted);font-size:.9rem}
@media(max-width:700px){.wrap{padding:18px 10px 38px}.tally-frame,.link-section{border-radius:14px}.tally-frame{padding:4px}.link-section{padding:22px 14px}.link-card{padding:20px 16px}}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="index.html">← Back to Northants History Network</a>
<section class="tally-frame" aria-label="Get Involved form">
<iframe data-tally-src="https://tally.so/embed/ZjrWoa?transparentBackground=1&amp;dynamicHeight=1" loading="lazy" width="100%" height="1800" frameborder="0" marginheight="0" marginwidth="0" title="Get Involved | Northants History Network"></iframe>
<p class="form-fallback">If the form does not appear, <a href="https://tally.so/r/ZjrWoa" target="_blank" rel="noopener noreferrer">open the Get Involved form in a new tab</a>.</p>
</section>
</main>
<script>
var d=document,w="https://tally.so/widgets/embed.js",v=function(){if(typeof Tally!=="undefined"){Tally.loadEmbeds()}else{d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc})}};if(typeof Tally!=="undefined"){v()}else if(d.querySelector('script[src="'+w+'"]')===null){var s=d.createElement("script");s.src=w;s.onload=v;s.onerror=v;d.body.appendChild(s)}
var copyButton=document.getElementById('copy-code');if(copyButton){copyButton.addEventListener('click',function(){var code=document.getElementById('nhn-code');var note=document.getElementById('copy-note');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(code.value).then(function(){note.textContent='Copied.'}).catch(function(){code.select();document.execCommand('copy');note.textContent='Copied.'})}else{code.select();document.execCommand('copy');note.textContent='Copied.'}})}
</script>
</body>
</html>
