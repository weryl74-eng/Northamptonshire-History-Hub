name: Temporary NNHS scroll fix

on:
  push:
    branches:
      - TEST-NHN-WORKING-SEP-2026

permissions:
  contents: write

jobs:
  fix-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only NNHS scroll change
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('archives-resources.html')
          s = p.read_text(encoding='utf-8')
          old = '.nnhs-card p{grid-area:copy;max-height:116px;overflow:hidden;margin:0}'
          new = '.nnhs-card p{grid-area:copy;height:82px;max-height:82px;overflow-y:auto;overflow-x:hidden;margin:0;padding-right:8px;scrollbar-width:thin}'
          if old not in s:
              raise SystemExit('Expected baseline NNHS rule not found; stopping without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit the surgical change and remove workflow
        run: |
          rm -f .github/workflows/temporary-nnhs-scroll.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archives-resources.html .github/workflows/temporary-nnhs-scroll.yml
          git commit -m 'Make only NNHS description scrollable'
          git push