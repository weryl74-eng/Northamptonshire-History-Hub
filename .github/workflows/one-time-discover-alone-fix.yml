name: One-time Discover Alone card fix
on:
  push:
    branches:
      - TEST-NHN-WORKING-SEP-2026
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Discover Alone image display
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('archives-resources.html')
          s = p.read_text(encoding='utf-8')
          old = '.nnhs-card .specialist-image{display:block;width:145px;height:122px;max-height:none;object-fit:cover;object-position:center;border-radius:10px;margin:0;border:1px solid #eadbc5}'
          new = '.nnhs-card .specialist-image{display:block;width:145px;height:122px;max-height:none;object-fit:cover;object-position:center;border-radius:10px;margin:0;border:1px solid #eadbc5}\n    .nnhs-card .specialist-image.discover-alone-image{object-fit:contain;object-position:center;background:#063d2c}'
          if old not in s:
              raise SystemExit('Target CSS not found; no change made.')
          s = s.replace(old, new, 1)
          old_img = '<img class="specialist-image" src="https://discoveralone.com/assets/share-card.png" alt="Discover Alone">'
          new_img = '<img class="specialist-image discover-alone-image" src="https://discoveralone.com/assets/share-card.png" alt="Discover Alone">'
          if old_img not in s:
              raise SystemExit('Target Discover Alone image tag not found; no change made.')
          s = s.replace(old_img, new_img, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archives-resources.html .github/workflows/one-time-discover-alone-fix.yml
          git rm .github/workflows/one-time-discover-alone-fix.yml
          git commit -m 'Show full Discover Alone image on test card'
          git push
