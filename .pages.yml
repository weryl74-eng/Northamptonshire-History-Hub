
# 1. Media folder location
media:
  input: images

# 2. Direct links to your individual web pages
content:
  - name: homepage
    label: Homepage (Main Page)
    type: file
    path: index.html
    fields:
      - name: hero_image
        label: Featured Event Image (Christmas Tree)
        type: image
      - name: body
        label: Page Content (HTML Code & Text)
        type: rich-text

  - name: about
    label: About Page
    type: file
    path: about.html
    fields:
      - name: body
        label: Page Content (HTML Code & Text)
        type: rich-text

  - name: get_involved
    label: Get Involved Page
    type: file
    path: get-involved.html
    fields:
      - name: body
        label: Page Content (HTML Code & Text)
        type: rich-text

  - name: archives
    label: Archives & Resources Page
    type: file
    path: archives-resources.html
    fields:
      - name: body
        label: Page Content (HTML Code & Text)
        type: rich-text
