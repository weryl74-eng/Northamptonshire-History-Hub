# 1. Define where your uploaded images will go
media: media

# 2. Define the editing forms for your site sections
content:
  # The Historical Timeline Section
  - name: timeline
    label: History Timeline
    type: collection
    path: _timeline/ # Tells the CMS where timeline files live
    fields:
      - name: title
        label: Era Title (e.g., Roman, Medieval)
        type: string
      - name: dates
        label: Date Range (e.g., AD 43–410)
        type: string
      - name: body
        label: Era Description Text
        type: rich-text

  # The What's On / Events Section
  - name: events
    label: What's On Events
    type: collection
    path: _events/ 
    fields:
      - name: title
        label: Event Name
        type: string
      - name: date
        label: Event Date
        type: date
      - name: image
        label: Featured Image Banner
        type: image
      - name: body
        label: Event Details & Ticket Info
        type: rich-text
